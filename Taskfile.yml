version: "3"

dotenv: [".env"]

vars:
  TOPIC: github.pr.opened
  USER_AGENT: redpanda-build-exercise
  SIM_DIR: sim/pr-opened
  OLLAMA_MODEL: qwen2.5:14b
  OLLAMA_HOST: 0.0.0.0:11434
  OLLAMA_URL: http://127.0.0.1:11434
  OLLAMA_LOG: .local/ollama.log

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  setup:
    desc: Create .env from example if missing; warn if GITHUB_TOKEN is empty
    cmds:
      - |
        set -euo pipefail
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "Created .env from .env.example — set GITHUB_TOKEN"
        else
          echo ".env already exists"
        fi
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "WARNING: GITHUB_TOKEN is empty (needed for github:events, github:pull, Connect, and reason)"
        else
          echo "GITHUB_TOKEN is set"
        fi

  infra:up:
    desc: Start Compose stack (Postgres, Redpanda, Connect, reason, serve)
    cmds:
      - |
        set -euo pipefail
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "GITHUB_TOKEN must be set in .env for Connect and Reason" >&2
          exit 1
        fi
      - docker compose --profile debug up -d --build --wait
      - |
        echo "Stack is up"
        echo "  - Serve    http://localhost:8080"
        echo "  - Console  http://localhost:8081/topics/{{.TOPIC}}/"
        echo "  - pgAdmin  http://localhost:8082"
        echo "  - Kafka    http://localhost:19092"
        echo "  - Postgres http://localhost:5432"
        echo "  - Ollama   http://localhost:11434"

  infra:down:
    desc: Stop Compose stack (keeps volumes)
    cmds:
      - "docker compose down"
      - echo "Stack stopped (volumes kept)"

  infra:down:clean:
    desc: Stop infra and delete volumes (wipes Postgres data and topic log)
    cmds:
      - "docker compose --profile debug down --volumes --remove-orphans"

  connect:up:
    desc: Start Connect ingest (requires GITHUB_TOKEN)
    deps: [infra:up]
    cmds:
      - |
        set -euo pipefail
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "GITHUB_TOKEN must be set in .env for Connect to poll GitHub" >&2
          exit 1
        fi
      - "docker compose up -d connect"
      - |
        echo "Connect started — next: task topic:consume   or   task logs SERVICE=connect"

  reason:up:
    desc: Start reason (consume topic, GitHub, Ollama, upsert Postgres)
    deps: [infra:up]
    cmds:
      - |
        set -euo pipefail
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "GITHUB_TOKEN must be set in .env for reason to fetch PRs" >&2
          exit 1
        fi
      - "docker compose up -d --build --remove-orphans reason"
      - |
        echo "reason started — next: task logs SERVICE=reason  or  task db:psql"

  reason:down:
    desc: Stop reason (worker keeps Postgres; serve can stay up)
    cmds:
      - "docker compose stop reason"
      - echo "reason stopped"

  serve:up:
    desc: Start serve (HTML + JSON API on :8080)
    deps: [infra:up]
    cmds:
      - "docker compose up -d --build --remove-orphans serve"
      - |
        echo "serve started — http://localhost:8080  JSON: http://localhost:8080/api/triages  logs: task logs SERVICE=serve"

  serve:down:
    desc: Stop serve (reason can keep classifying)
    cmds:
      - "docker compose stop serve"
      - echo "serve stopped"

  test:
    desc: Run Go tests
    cmds:
      - go test {{.CLI_ARGS}} ./...

  github:events:
    desc: GET /events — type counts and opened PRs (VERBOSE=1 for full page)
    cmds:
      - |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "install jq (e.g. brew install jq)" >&2
          exit 1
        fi
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "GITHUB_TOKEN is empty — set it in .env" >&2
          exit 1
        fi
        body=$(curl -sS \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "User-Agent: {{.USER_AGENT}}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/events)
        echo "=== event types ==="
        echo "$body" | jq 'group_by(.type) | map({type: .[0].type, n: length})'
        echo "=== PullRequestEvent action=opened ==="
        echo "$body" | jq '[.[] | select(.type=="PullRequestEvent" and .payload.action=="opened")]'
        if [ "${VERBOSE:-}" = "1" ]; then
          echo "=== full page ==="
          echo "$body" | jq .
        fi

  github:pull:
    desc: GET pull + files (REPO=owner/name PR=42); files capped like the worker
    cmds:
      - |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "install jq (e.g. brew install jq)" >&2
          exit 1
        fi
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "GITHUB_TOKEN is empty — set it in .env" >&2
          exit 1
        fi
        if [ -z "{{.REPO}}" ] || [ -z "{{.PR}}" ]; then
          echo "usage: task github:pull REPO=owner/name PR=42" >&2
          exit 1
        fi
        ua="{{.USER_AGENT}}"
        pull=$(curl -sS \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "User-Agent: $ua" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/{{.REPO}}/pulls/{{.PR}}")
        files=$(curl -sS \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "User-Agent: $ua" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/{{.REPO}}/pulls/{{.PR}}/files?per_page=20")
        echo "=== pull ==="
        echo "$pull" | jq '{title, html_url, body_len: ((.body // "") | length), user: .user.login}'
        echo "=== files (max 20; patch truncated to 4000 chars) ==="
        echo "$files" | jq '[.[0:20][] | {filename, status, patch_len: ((.patch // "") | length), patch: ((.patch // "")[0:4000])}]'

  ollama:up:
    desc: Start host ollama serve if {{.OLLAMA_URL}}/api/ps is not OK
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! command -v ollama >/dev/null 2>&1; then
          echo "install Ollama from https://ollama.com" >&2
          exit 1
        fi
        base="{{.OLLAMA_URL}}"
        base="${base%/}"
        if curl -sfS --max-time 2 "${base}/api/ps" >/dev/null; then
          echo "Ollama already running at ${base}"
        else
          mkdir -p .local
          touch "{{.OLLAMA_LOG}}"
          OLLAMA_HOST={{.OLLAMA_HOST}} nohup ollama serve >>"{{.OLLAMA_LOG}}" 2>&1 &
          ok=0
          for _ in $(seq 1 40); do
            if curl -sfS --max-time 1 "${base}/api/ps" >/dev/null; then
              ok=1
              break
            fi
            sleep 0.25
          done
          if [ "$ok" != 1 ]; then
            echo "Ollama did not become ready — task ollama:logs" >&2
            exit 1
          fi
          echo "started ollama serve OLLAMA_HOST={{.OLLAMA_HOST}} log={{.OLLAMA_LOG}}"
        fi
      - task: ollama:check

  ollama:logs:
    desc: Tail host ollama serve logs ({{.OLLAMA_LOG}})
    silent: true
    cmds:
      - |
        set -euo pipefail
        mkdir -p .local
        touch "{{.OLLAMA_LOG}}"
        echo "tailing {{.OLLAMA_LOG}} (Ctrl-C to stop)"
        echo "empty if Ollama was started outside task ollama:up (e.g. Ollama.app)"
        tail -f "{{.OLLAMA_LOG}}" || {
          code=$?
          if [ "$code" -eq 130 ] || [ "$code" -eq 143 ]; then
            exit 0
          fi
          exit "$code"
        }

  ollama:down:
    desc: Stop host ollama if pgrep ollama finds a process
    silent: true
    cmds:
      - |
        set -euo pipefail
        if pgrep ollama >/dev/null 2>&1; then
          pids=$(pgrep ollama)
          echo "killing ollama pids: $pids"
          # shellcheck disable=SC2086
          kill $pids || true
        else
          echo "ollama is not running"
        fi

  ollama:check:
    desc: Verify Ollama is reachable (version + models)
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "install jq (e.g. brew install jq)" >&2
          exit 1
        fi
        base="{{.OLLAMA_URL}}"
        base="${base%/}"
        model="{{.OLLAMA_MODEL}}"
        if ! ver=$(curl -sfS --max-time 3 "${base}/api/version"); then
          echo "Ollama is not reachable at ${base}" >&2
          echo "Start it with: task ollama:up" >&2
          echo "Override URL: task ollama:check OLLAMA_URL=http://127.0.0.1:11434" >&2
          exit 1
        fi
        echo "=== version (${base}) ==="
        echo "$ver" | jq .
        tags=$(curl -sfS --max-time 5 "${base}/api/tags")
        echo "=== models ==="
        echo "$tags" | jq '{models: [.models[]?.name]}'
        if echo "$tags" | jq -e --arg m "$model" '[.models[]?.name] | any(startswith($m))' >/dev/null; then
          echo "model ${model} is present"
        else
          echo "WARNING: working-default model ${model} is not pulled — ollama pull ${model}" >&2
        fi

  logs:
    desc: Tail compose logs (SERVICE=redpanda optional)
    cmds:
      - "docker compose logs -f {{.SERVICE}}"

  sim:reset:
    desc: Drop sim rows in Postgres and recreate the work topic (all messages)
    cmds:
      - |
        set -euo pipefail
        BROKERS="-X brokers=redpanda:9092"
        docker compose exec -T postgres psql -U triage -d triage -c "DELETE FROM pr_triages WHERE event_id LIKE 'sim-%';"
        connect_was_up=0
        if [ -n "$(docker compose ps -q --status running connect 2>/dev/null || true)" ]; then
          connect_was_up=1
          docker compose stop connect
        fi
        docker compose exec -T redpanda rpk topic delete {{.TOPIC}} $BROKERS || true
        docker compose exec -T redpanda rpk topic create {{.TOPIC}} $BROKERS
        if [ "$connect_was_up" = 1 ]; then
          docker compose start connect
        fi
        echo "Reset: Postgres sim-% rows deleted, topic {{.TOPIC}} recreated"

  sim:reset:all:
    desc: Delete all pr_triages rows and recreate the work topic (all messages)
    cmds:
      - |
        set -euo pipefail
        BROKERS="-X brokers=redpanda:9092"
        docker compose exec -T postgres psql -U triage -d triage -c "DELETE FROM pr_triages;"
        connect_was_up=0
        if [ -n "$(docker compose ps -q --status running connect 2>/dev/null || true)" ]; then
          connect_was_up=1
          docker compose stop connect
        fi
        docker compose exec -T redpanda rpk topic delete {{.TOPIC}} $BROKERS || true
        docker compose exec -T redpanda rpk topic create {{.TOPIC}} $BROKERS
        if [ "$connect_was_up" = 1 ]; then
          docker compose start connect
        fi
        echo "Reset all: Postgres pr_triages emptied, topic {{.TOPIC}} recreated"

  sim:produce:
    desc: Produce {{.SIM_DIR}}/*.json onto the work topic (no GitHub API)
    cmds:
      - |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "install jq (e.g. brew install jq)" >&2
          exit 1
        fi
        shopt -s nullglob
        files=({{.SIM_DIR}}/*.json)
        if [ ${#files[@]} -eq 0 ]; then
          echo "no fixtures in {{.SIM_DIR}}" >&2
          exit 1
        fi
        for f in "${files[@]}"; do
          echo "produce $f"
          compact=$(jq -c . "$f")
          docker compose exec -T -e MSG="$compact" redpanda sh -c 'printf "%s\n" "$MSG" | rpk topic produce {{.TOPIC}} -X brokers=redpanda:9092'
        done
        echo "Produced ${#files[@]} message(s) to {{.TOPIC}} — Console http://localhost:8081"

  sim:replay:
    desc: sim:reset then sim:produce
    cmds:
      - task: sim:reset
      - task: sim:produce
