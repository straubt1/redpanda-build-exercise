# Phase 0–1: Postgres + Redpanda + Connect. Ollama / app are later phases.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=redpanda:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 5s
      retries: 10

  connect:
    image: docker.redpanda.com/redpandadata/connect:4.106.0
    depends_on:
      redpanda:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./connect/ingest.yaml:/connect.yaml:ro
    command: ["run", "/connect.yaml"]
    restart: unless-stopped

  console:
    image: docker.redpanda.com/redpandadata/console:v3.10.0
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  postgres_data:
